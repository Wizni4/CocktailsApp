# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - 'dev*'
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Force Windows-style line endings (CRLF)
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf

    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Lint
      run: dotnet tool install -g dotnet-format && dotnet format style --verify-no-changes --verbosity diagnostic

    - name: Build
      run: dotnet build --no-restore -p:TreatWarningsAsErrors=true -p:EnforceCodeStyleInBuild=true

    - name: Test with Coverage
      run: dotnet test --collect:"XPlat Code Coverage"

    - name: Install ReportGenerator
      run: dotnet tool install --global dotnet-reportgenerator-globaltool

    - name: Generate Coverage Report
      run: reportgenerator -reports:**/coverage.cobertura.xml -targetdir:coverage -reporttypes:Html

    - name: Check Coverage Threshold
      run: |
        coverage=$(grep -Po '(?<=line-rate=")[^"]*' **/coverage/Cobertura.xml | head -1)
        threshold=80.0
        if (( $(echo "$coverage < $threshold" | bc -l) )); then
          echo "Coverage $coverage% is below the threshold of $threshold%"
          exit 1
        else
          echo "Coverage $coverage% meets the threshold of $threshold%"
        fi

    - name: Upload Coverage Report
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage
