# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches:
      - 'dev*'
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Force Windows-style line endings (CRLF)
      run: |
        git config --global core.autocrlf true
        git config --global core.eol crlf

    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x' # Ensure this matches the version used to build your analyzer

    - name: Restore dependencies
      run: dotnet restore

    - name: Lint
      run: dotnet tool install -g dotnet-format && dotnet format style --verify-no-changes --verbosity diagnostic

    - name: Build
      run: dotnet build --no-restore -p:TreatWarningsAsErrors=true -p:EnforceCodeStyleInBuild=true

    - name: Test
      run: dotnet test --no-build --verbosity minimal
