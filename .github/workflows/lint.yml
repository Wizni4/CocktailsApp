name: Lint

on:
  workflow_call:

jobs:
    lint:
        runs-on: ubuntu-latest

        steps:
          - name: Setup .NET
            uses: /.github/actions/setup-dotnet/action.yml

          - name: Install dependencies
            run: dotnet tool install -g dotnet-format

          - name: Lint
            run: dotnet format style --verify-no-changes --verbosity diagnostic --report './lint-report.json'

          - name: Upload Lint Report Artifact
            uses: actions/upload-artifact@v4
            with:
              name: lint-report
              path: ./lint-report.json    