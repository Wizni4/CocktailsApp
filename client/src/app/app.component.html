<head>

</head>
<body class="app-body">
  <header class="app-header">
    <div class="logo">
      <img src="assets/logo.png" alt="Logo" />
    </div>
    <div class="auth-options">
      <ng-container *ngIf="isAuthenticated$ | async as isAuthenticated">
        <button *ngIf="!isAuthenticated" routerLink="/auth/signup">Sign Up</button>
        <button *ngIf="!isAuthenticated" routerLink="/auth/signin">Sign In</button>
        <button *ngIf="isAuthenticated" (click)="signOut()">Sign Out</button>
      </ng-container>
    </div>
  </header>

  <main class="app-main">
    <router-outlet></router-outlet>
  </main>

  <footer class="app-footer">
    <p>© 2025. All rights reserved.</p>
  </footer>
</body>
