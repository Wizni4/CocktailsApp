<div class="row justify-content-center my-5">
  <div class="col-4">
    <div class="card">
      @if (!isConfirm) {
        <div class="card-body">
          <div class="row">
            <div class="col mb-2">
              <label for="name" class="form-label">Username:</label>
              <input type="text" id="username" name="username" #email="ngModel" [(ngModel)]="signUpRequest.username" class="form-control form-control-sm">
            </div>
          </div>
          <div class="row">
            <div class="col mb-2">
              <label for="email" class="form-label">Email:</label>
              <input type="email" id="email" name="email" #email="ngModel" [(ngModel)]="signUpRequest.email" class="form-control form-control-sm">
            </div>
          </div>
          <div class="row">
            <div class="col mb-2">
              <label for="password" class="form-label">Password:</label>
              <div class="input-group input-group-sm">
                <input [type]="password" id="password" name="signUpRequest.password" #password="ngModel" [(ngModel)]="password" class="form-control form-control-sm">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col d-grid">
              <button type="button" (click)="signUp()" class="btn btn-sm btn-success" [disabled]="loading">
                @if (loading) {
                  <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                }
                Sign up
              </button>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</div>
