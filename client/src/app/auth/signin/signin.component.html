<main class="auth-main">
  <div class="auth-card">
    <h2 class="auth-title">Sign In</h2>

    <!-- Username -->
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text"
             pInputText
             id="username"
             [(ngModel)]="signInRequest.username"
             class="form-control" />
    </div>

    <!-- Password -->
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password"
             pInputText
             id="password"
             [(ngModel)]="signInRequest.password"
             class="form-control" />
    </div>

    <!-- Sign In Button -->
    <div class="form-group">
      <button type="button"
              pButton
              label="Sign In"
              class="w-full"
              [disabled]="loading"
              (click)="signIn()">
        <ng-container *ngIf="loading">
          <span class="pi pi-spin pi-spinner mr-2"></span>
        </ng-container>
      </button>
    </div>
  </div>
</main>
