<main class="ingredients-main shadow-2">
  <p-table [value]="ingredients" class="ingredients-table">
    <ng-template #header>
      <tr>
        <th>Name</th>
        <th>Type</th>
      </tr>
      <tr>
        <th colspan="2">
          <div class="create-ingredient__container" routerLink="/ingredients/create">
            <span class="pi pi-plus-circle" style="font-size: 1.5rem; "></span>
            <span style="padding-left: 0.5rem;">Add ingredient</span>
          </div>
        </th>
      </tr>
    </ng-template>
    <ng-template #body let-ingredient>
      <tr>
        <td>{{ ingredient.name }}</td>
        <td>{{ ingredient.type }}</td>
      </tr>
    </ng-template>
  </p-table>

</main>
