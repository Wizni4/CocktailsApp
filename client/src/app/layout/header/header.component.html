<header class="app-header shadow-2">
  <div class="logo">
    <a routerLink="/home">
        <img src="assets/logo.png" alt="Logo" />
        <span>Cocktails App</span>
    </a>
  </div>
  <div class="auth-options">
    <!--Dark mode toggler-->
    <p-button *ngIf="layoutService.isDarkMode()" (click)="toggleDarkMode()" icon="pi pi-moon" [rounded]="true" [text]="true"/>
    <p-button *ngIf="!layoutService.isDarkMode()" (click)="toggleDarkMode()" icon="pi pi-sun" [rounded]="true" [text]="true"/>

    <!--SignIn-->
    <p-button *ngIf="!(isAuthenticated$ | async)" routerLink="/auth/signin" label="Sign In" variant="text" />

    <!--SignUp-->
    <p-button *ngIf="!(isAuthenticated$ | async)" routerLink="/auth/signup" label="Sign Up" [raised]="true" variant="outlined" />

    <!--Profile (only if authicated)-->
    <p-button *ngIf="(isAuthenticated$ | async)" routerLink="/auth/profile" icon="pi pi-user" [rounded]="true" [text]="true" severity="info" />
    <p-button *ngIf="(isAuthenticated$ | async)" (click)="signOut()" routerLink="/auth/signout" icon="pi pi-power-off" [rounded]="true" [text]="true" />
  </div>
</header>
